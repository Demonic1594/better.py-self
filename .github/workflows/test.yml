name: Test

on:
  push:
  pull_request:
    types: [ opened, synchronize ]

# Runs do not need to be concurrent
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        extras: ['test']
        include:
          # The speed extras (orjson, mmh3, zstandard, Brotli, aiodns) are
          # exercised on two versions; the perf-smoke allocation tests run
          # only in these legs (pytest -m perf)
          - python-version: '3.12'
            extras: 'test,speed'
          - python-version: '3.14'
            extras: 'test,speed'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up CPython ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        shell: bash
        run: |
          ARGS=(-vs --cov=discord --cov-report term-missing:skip-covered)
          if [[ "${{ matrix.extras }}" != "test,speed" ]]; then ARGS+=(-m "not perf"); fi
          PYTHONPATH="$(pwd)" pytest "${ARGS[@]}"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discord.py-self"
description = "A Python wrapper for the Discord user API"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rapptz" }, { name = "Dolfies" }]
maintainers = [{ name = "Demonic1594" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dynamic = ["version", "dependencies"]

[project.urls]
Documentation = "https://github.com/Demonic1594/better.py-self#readme"
"Issue tracker" = "https://github.com/Demonic1594/better.py-self/issues"
"Upstream (dolfies/discord.py-self)" = "https://github.com/dolfies/discord.py-self"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[project.optional-dependencies]
voice = [
    "PyNaCl>=1.6.0,<1.7",
    "davey>=0.1.0"
]
docs = [
    "sphinx==4.4.0",
    "sphinxcontrib_trio==1.1.2",
    # TODO: bump these when migrating to a newer Sphinx version
    "sphinxcontrib-websupport==1.2.4",
    "sphinxcontrib-applehelp==1.0.4",
    "sphinxcontrib-devhelp==1.0.2",
    "sphinxcontrib-htmlhelp==2.0.1",
    "sphinxcontrib-jsmath==1.0.1",
    "sphinxcontrib-qthelp==1.0.3",
    "sphinxcontrib-serializinghtml==1.1.5",
    "typing-extensions>=4.3,<5",
    "sphinx-inline-tabs==2023.4.21",
    # TODO: Remove this when moving to Sphinx >= 6.6
    "imghdr-lts==1.0.0; python_version>='3.13'",
]
speed = [
    "orjson>=3.5.4",
    "aiodns>=1.1; sys_platform != 'win32'",
    "Brotli",
    "mmh3>=2.5",
    "zstandard>=0.23.0; python_version <= '3.13'"
]
test = [
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "typing-extensions>=4.3,<5",
    "tzdata; sys_platform == 'win32'",
]
dev = [
    "ruff==0.12",
    "typing_extensions>=4.3,<5",
]

[tool.setuptools]
packages = [
    "discord",
    "discord.types",
    "discord.webhook",
    "discord.ext.commands",
    "discord.ext.tasks",
]
include-package-data = true

[tool.ruff]
line-length = 125
extend-exclude = ["docs"]

[tool.ruff.lint]
# Tests are linted but not reformatted (see [tool.ruff.format]): an explicit,
# version-stable rule set (syntax errors, pyflakes, pycodestyle subsets)
# that holds across the whole repo including the regression suites.
# E731/E741/E712 match long-standing upstream style (lambda sinks in the
# gateway, comparison truthiness in flag-heavy code); star exports in
# __init__.py are the documented public API surface.
exclude = ["docs"]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # deferred module imports break circular-import cycles by design
    "E731",  # lambda sinks are long-standing upstream style
    "E741",  # short loop/lambda variables likewise
    "E712",  # flag objects overload == deliberately
    "F403",  # star exports are the documented public API surface
    "F405",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
exclude = ["tests"]
line-ending = "auto"
quote-style = "single"

[tool.coverage.run]
omit = [
    "discord/__main__.py",
    "discord/types/*",
    "*/_types.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
]

[tool.pyright]
include = [
    "discord",
    "discord/types",
    "discord/ext",
    "discord/ext/commands",
    "discord/ext/tasks",
]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    "docs",
]
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "error"
reportShadowedImports = false
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "perf: allocation-count performance smoke tests (run in the speed-extras CI legs)",
]
